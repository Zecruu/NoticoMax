<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>NOTICO MAX Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #171717;
        --muted: #666666;
        --border: #e5e5e5;
        --card: #ffffff;
        --primary: #171717;
        --primary-fg: #ffffff;
        --warn-bg: #fef3c7;
        --warn-fg: #92400e;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --fg: #f5f5f5;
          --muted: #a3a3a3;
          --border: #2f2f2f;
          --card: #171717;
          --primary: #f5f5f5;
          --primary-fg: #171717;
          --warn-bg: rgba(245, 158, 11, 0.12);
          --warn-fg: #fbbf24;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
      }

      .shell {
        width: 100%;
        max-width: 420px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 32px;
      }

      .brand img {
        width: 44px;
        height: 44px;
        border-radius: 10px;
      }

      .brand strong {
        display: block;
        font-size: 14px;
        letter-spacing: 0.02em;
      }

      .brand span {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
      }

      .icon {
        width: 48px;
        height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        background: var(--warn-bg);
        color: var(--warn-fg);
        font-size: 22px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: 26px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      p {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
      }

      .card {
        margin-top: 22px;
        border: 1px solid var(--border);
        background: var(--card);
        border-radius: 8px;
        padding: 16px;
      }

      .card strong {
        display: block;
        font-size: 14px;
      }

      .card p {
        margin-top: 6px;
        font-size: 14px;
      }

      button {
        margin-top: 22px;
        min-height: 44px;
        width: 100%;
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: var(--primary-fg);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="shell" aria-labelledby="offline-title">
        <div class="brand">
          <img src="logo.png" alt="NOTICO MAX" />
          <div>
            <strong>NOTICO MAX</strong>
            <span>Offline mode</span>
          </div>
        </div>

        <div class="icon" aria-hidden="true">!</div>
        <h1 id="offline-title">You are offline</h1>
        <p>
          NoticoMax cannot reach the live app right now. Previously saved local
          data remains on this device, and sync will resume when the connection
          returns.
        </p>

        <div class="card">
          <strong>No black screen</strong>
          <p>
            This fallback is built into the app shell. Reconnect and retry to
            reopen your workspace.
          </p>
        </div>

        <button type="button" onclick="window.location.href='https://app.noticomax.com/'">
          Retry
        </button>
      </section>
    </main>
    <script>
      window.addEventListener("online", function () {
        window.location.href = "https://app.noticomax.com/";
      });
    </script>
  </body>
</html>
